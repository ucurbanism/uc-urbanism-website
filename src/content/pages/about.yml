group_photo_alt: Urbanism Club Group
intro_lines: |
  Urbanism Club aims to connect students and other members of the Uptown community; through 
  discussions with local experts and others in the know; sharing new projects and ideas; and group
  projects and activities. Host to the University of Cincinnati student chapter of the American Planning 
  Association(APA) (Planning Student Organization(PSO)), and the UC Urbanism Strong Towns Local 
  Conversation, we support UC DAAP planning students, and embody Strong Towns principles.
about_heading: About us
about_text: |
  Urbanism Club is a student-led, community organization that aims to connect students and other members of the Uptown community who are interested in urbanism. 

  Our members learn about and advocate for better communities through: discussions with local experts and community organizations, projects focused on regional issues, volunteer opportunities, workshops, and more.
what_is_heading: What is Urbanism?
what_is_text: "Urbanism refers to the way of life or characteristics or a city or town. We think of it as “being of the city,” an active participant in your locality."
goals_heading: Our Main Goals
goals:
  - title: Educate
    text: "Provide opportunities to learn more about urban challenges, initiatives, organizations, and more from the area and beyond. "
  - title: Connect
    text: "Create a space for individuals interested in urbanism to connect with each other, local experts, community organizers, and more. "
  - title: Advocate
    text: "Support local initiatives and organizations by volunteering, campaigning, and sharing resources."
affiliates_heading: Affiliate Organizations
affiliates_text: "Urbanism Club is home to the University of Cincinnati Planning Student Organization, officially registered with the American Planning Organization. Additionally, we are an official local StrongTowns Conversation, alongside friend of the club Civic Cincinnati, and an All Aboard Ohio Affiliate Club. "
affiliates_note: "To get more information on any of these organizations, check out our Resources page!"
