[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long-lived caching for Astro's hashed assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic security headers (these govern our pages only; the calendar/Sheets/Instagram
# embeds we load are unaffected)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# v1.5 folded the Events page into Connect and retired the Join form's thank-you page.
# Keep old links and QR codes working.
[[redirects]]
  from = "/events"
  to = "/connect#events"
  status = 301

[[redirects]]
  from = "/events/*"
  to = "/connect#events"
  status = 301

# Explicit paths, not a /join/* splat: on Netlify a splat also matches its own base path,
# so "/join/*" -> "/join" pointed at itself and never fired (v1.5.0 shipped with that bug).
[[redirects]]
  from = "/join/thanks"
  to = "/join/"
  status = 301

[[redirects]]
  from = "/join/thanks/"
  to = "/join/"
  status = 301
