<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Decap CMS: edits the YAML files under src/content/ and commits them to GitHub -->
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Merged into config.yml: the CMS links back to the site it's served from, on any host -->
    <script>CMS.init({ config: { site_url: location.origin, display_url: location.origin } });</script>
  </body>
</html>
