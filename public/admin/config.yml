# Decap CMS configuration. Any club or board member can edit: they log in with GitHub and need write access to the repo.
# Saving makes a draft pull request; only the club account (ucurbanism) can publish it to main (see MAINTAINERS.md).
# Locally: run `npm run dev` and `npm run cms`, then open http://localhost:4321/admin/index.html
backend:
  name: github
  repo: ucurbanism/uc-urbanism-website
  branch: main
  commit_messages:
    create: "Content: create {{collection}} \"{{slug}}\""
    update: "Content: update {{collection}} \"{{slug}}\""
    delete: "Content: delete {{collection}} \"{{slug}}\""
    uploadMedia: "Content: upload \"{{path}}\""
    deleteMedia: "Content: delete \"{{path}}\""

# Each save becomes a draft on a cms/... branch with its own pull request, instead of a commit to main.
publish_mode: editorial_workflow

# Lets the local proxy (npm run cms) take over when running on localhost.
local_backend: true

site_url: https://uc-urbanism.netlify.app
display_url: https://uc-urbanism.netlify.app
media_folder: public/uploads
public_folder: /uploads
editor:
  preview: false

collections:
  - name: settings
    label: Site settings
    editor: { preview: false }
    files:
      - name: site
        label: Links & analytics
        file: src/content/settings/site.yml
        fields:
          - { name: site_name, label: Site name, widget: string }
          - { name: google_analytics_id, label: Google Analytics ID, widget: string, required: false }
          - { name: google_site_verification, label: Google Search Console verification token, widget: string, required: false, hint: "Paste the content value of the google-site-verification meta tag." }
          - { name: contact_email, label: Contact email, widget: string, required: false, hint: "Shown in the footer as \"Questions?\". Leave blank to hide it." }
          - name: qr_links
            label: QR code links (Connect page)
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: url, label: URL, widget: string }
              - { name: image, label: QR image path, widget: string, hint: "e.g. /media/qr-instagram.svg" }
          - name: text_links
            label: Text links (Connect page)
            hint: "Listed under the QR codes. A link with the same label as a QR code is left out, since the QR code's label already links there."
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: url, label: URL, widget: string }

  - name: pages
    label: Pages
    editor: { preview: false }
    files:
      - name: about
        label: About Us (home)
        file: src/content/pages/about.yml
        fields:
          - { name: seo_title, label: Browser/tab title, widget: string }
          - { name: seo_description, label: Search/share description, widget: text }
          - { name: h1, label: Page heading (screen readers / SEO), widget: string, required: false, hint: "Not shown visually — the logo image is the visible title." }
          - { name: logo_alt, label: Hero image alt text, widget: string }
          - { name: hero_image, label: Hero image, widget: image, required: false, media_folder: images, public_folder: images, hint: "Replaces the Urbanism Club logo graphic at the top of the home page. Leave blank to keep the logo." }
          - { name: lede, label: Opening sentence (what the club is), widget: text, hint: "The first thing a visitor reads. Say what the club does, plainly." }
          - { name: cta_label, label: Main button label, widget: string, required: false }
          - { name: cta_note, label: Note under the main button, widget: string, required: false }
          - { name: taglines, label: Taglines under the logo, widget: list, field: { name: line, label: Line (markdown links allowed), widget: string } }
          - { name: group_photo_alt, label: Group photo alt text, widget: string }
          - { name: figure_park_alt, label: "Park photo: alt text", widget: string, required: false }
          - { name: figure_park_caption, label: "Park photo: caption", widget: string, required: false }
          - { name: figure_walk_alt, label: "Campus walk photo: alt text", widget: string, required: false }
          - { name: figure_walk_caption, label: "Campus walk photo: caption", widget: string, required: false }
          - { name: figure_meeting_alt, label: "Meeting photo: alt text", widget: string, required: false }
          - { name: figure_meeting_caption, label: "Meeting photo: caption", widget: string, required: false }
          - { name: intro_lines, label: Intro paragraph, widget: text }
          - { name: about_heading, label: About heading, widget: string }
          - { name: about_text, label: About text, widget: markdown }
          - { name: what_is_heading, label: "What is Urbanism heading", widget: string }
          - { name: what_is_text, label: "What is Urbanism text", widget: markdown }
          - { name: goals_heading, label: Goals heading, widget: string }
          - name: goals
            label: Goals
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }
          - { name: affiliates_heading, label: Affiliates heading, widget: string }
          - { name: affiliates_text, label: Affiliates text, widget: markdown }
          - { name: leadership_heading, label: Leadership heading, widget: string }
          - { name: closing_heading, label: Closing call-to-action heading, widget: string, required: false }
          - { name: closing_text, label: Closing call-to-action text, widget: text, required: false }
      - name: connect
        label: Connect
        file: src/content/pages/connect.yml
        fields:
          - { name: seo_title, label: Browser/tab title, widget: string }
          - { name: seo_description, label: Search/share description, widget: text }
          - { name: get_connected_heading, label: Heading, widget: string }
          - { name: get_connected_text, label: Text, widget: markdown }
          - { name: qr_note, label: QR code note, widget: string, required: false }
          - { name: join_heading, label: "Join section: heading", widget: string, hint: "The mailing-list section right below the QR codes. The nav's Join pill links here." }
          - { name: join_intro_text, label: "Join section: what the mailing list is", widget: text, required: false, hint: "What they're signing up for and how often you email." }
          - { name: signup_url, label: "Join section: Google Form link", widget: string, required: false, hint: "Paste the form's Send → link (https://forms.gle/…). Leave blank to show the GroupMe button instead." }
          - { name: signup_label, label: "Join section: button label", widget: string }
          - { name: privacy_note, label: "Join section: note under the button", widget: text, required: false }
          - { name: join_fallback_text, label: "Join section: text shown while no Google Form is linked", widget: text, required: false, hint: "Shown until the Google Form link is filled in. Meanwhile the mailing-list button goes to the 404 page and a GroupMe button is shown." }
          - { name: events_heading, label: Events heading, widget: string }
          - { name: calendar_text, label: Calendar caption, widget: string }
          - { name: calendar_src, label: Google Calendar embed URL, widget: string, hint: "Month view. The agenda list above it uses the same URL automatically. To add or remove a calendar, add or remove a src= part." }
          - { name: schedule_heading, label: "Meeting polls: heading", widget: string }
          - { name: schedule_text, label: "Meeting polls: caption", widget: text, required: false }
          - { name: schedule_embed_src, label: "Meeting polls: poll site address", widget: string, required: false, hint: "The club's poll site, e.g. https://….netlify.app. Leave blank to hide the section." }
          - { name: instagram_embed_src, label: Instagram embed URL, widget: string }
          - { name: meetings_heading, label: Meetings heading, widget: string }
          - { name: meetings_lines, label: Meetings text, widget: text }
          - { name: meetings_address, label: Meetings address, widget: string }
          - { name: meetings_photo_alt, label: Meetings photo alt text, widget: string }
      - name: resources
        label: Resources
        file: src/content/pages/resources.yml
        fields:
          - { name: seo_title, label: Browser/tab title, widget: string }
          - { name: seo_description, label: Search/share description, widget: text }
          - { name: projects_heading, label: Projects heading, widget: string }
          - { name: projects_text, label: Projects intro text, widget: text, required: false }
          - { name: projects_form_label, label: Project form link text, widget: string }
          - { name: projects_form_url, label: Project form URL, widget: string }
          - { name: projects_sheet_src, label: Projects spreadsheet embed URL, widget: string }
      - name: not-found
        label: 404 page (page not found)
        file: src/content/pages/not-found.yml
        fields:
          - { name: seo_title, label: Browser/tab title, widget: string }
          - { name: seo_description, label: Search/share description, widget: text }
          - { name: heading, label: Heading, widget: string }
          - { name: text, label: Text, widget: text, required: false, hint: "Shown for any address that doesn't exist, and for the mailing-list button until the Google Form is linked." }

  - name: leadership
    label: Leadership
    label_singular: Leader
    folder: src/content/leadership
    media_folder: photos
    public_folder: photos
    extension: yml
    format: yml
    create: true
    slug: "{{order}}-{{slug}}"
    identifier_field: name
    summary: "{{order}}. {{role}}, {{name}}"
    sortable_fields: [order, name]
    editor: { preview: false }
    fields:
      - { name: order, label: Order, widget: number, value_type: int, min: 1 }
      - { name: role, label: Role, widget: string }
      - { name: name, label: Name, widget: string }
      - { name: link, label: Link, widget: string, required: false }
      - { name: photo, label: Photo, widget: image, required: false, hint: "Square-ish headshot; it is cropped to a circle." }

  - name: affiliates
    label: Affiliate organizations
    label_singular: Affiliate
    folder: src/content/affiliates
    media_folder: logos
    public_folder: logos
    extension: yml
    format: yml
    create: true
    identifier_field: name
    summary: "{{order}}. {{name}}"
    sortable_fields: [order, name]
    editor: { preview: false }
    fields:
      - { name: order, label: Order, widget: number, value_type: int, min: 1 }
      - { name: name, label: Name, widget: string }
      - { name: logo, label: Logo, widget: image, hint: "Use a PNG with a transparent background (or an SVG). At night it is shown solid white unless a night version is set." }
      - { name: logo_night, label: Night-mode logo, widget: image, required: false, hint: "Optional. Only needed when a solid-white version of the logo loses detail." }
      - { name: link, label: Link, widget: string, required: false }
