# Builds the site and publishes it to GitHub Pages. Only runs when started by hand (Actions → Deploy to GitHub
# Pages → Run workflow), so it never fails while Pages is switched off. Setup, once: Settings → Pages → Source:
# GitHub Actions, and a repository variable SITE_URL with the site's address (README → Hosting). To deploy on
# every push instead, add `push: { branches: [main] }` under `on:`.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: npm test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
